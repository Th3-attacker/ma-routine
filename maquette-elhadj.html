<title>ELHADJ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Reem+Kufi:wght@500;600;700&display=swap">
<style>
/* Layout: one-column phone app, bilingual (French LTR / Arabic RTL). Sticky header, bottom tab bar,
   and a single bold moment: a sky panel whose colour follows the real time of day, with the sun's path over the prayer times. */
:root{
  --bg:#F1F2F7; --surface:#FFFFFF; --surface-2:#E8EAF3; --line:#DCDFEA;
  --ink:#151935; --ink-2:#464B6B; --muted:#767B99;
  --primary:#2C3B8F; --primary-soft:#E3E7F8; --on-primary:#FFFFFF;
  --gold:#B97A1C; --gold-soft:#FAEBD2;
  --ok:#1E7B56; --ok-soft:#DCF0E6; --warn:#B26D12; --warn-soft:#F9EAD2; --bad:#B23B3B; --bad-soft:#F6DFDF;
  --c1:#D9822B; --c2:#2F6FD1; --c3:#7B5BC9; --c4:#C2457A; --c5:#1F9A8A; --c6:#D2493F; --c7:#2E8B57; --c8:#A0752E; --c9:#2E95BC; --c10:#7C819E;
  --scrim:rgba(12,14,34,.48);
  --shadow:0 1px 2px rgba(21,25,53,.05),0 6px 18px rgba(21,25,53,.06);
  --sky-ink:#FFFFFF; --sky-deep:#151935; --sky-accent:#FFD27F; --sky-line:rgba(255,255,255,.55); --sky-faint:rgba(255,255,255,.14);
  --sky-night:linear-gradient(165deg,#10143A 0%,#22306E 100%);
  --sky-dawn:linear-gradient(165deg,#222B68 0%,#6E4F8E 55%,#C9824A 100%);
  --sky-day:linear-gradient(165deg,#24509F 0%,#4F86D3 100%);
  --sky-dusk:linear-gradient(165deg,#241F5C 0%,#7A3A68 58%,#C86A3C 100%);
  --font-display:"Reem Kufi","Manrope",system-ui,sans-serif;
  --font-body:"Manrope","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-ar:"Amiri","Noto Naskh Arabic","Geeza Pro","Traditional Arabic",serif;
  --r-lg:20px; --r-md:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1022; --surface:#161A31; --surface-2:#20253F; --line:#2A3050;
    --ink:#ECEEF8; --ink-2:#B7BBD4; --muted:#8A8FAE;
    --primary:#94A4F5; --primary-soft:#232A55; --on-primary:#0D1022;
    --gold:#EFB25A; --gold-soft:#382B16;
    --ok:#5FCB98; --ok-soft:#14352A; --warn:#EFB25A; --warn-soft:#382B16; --bad:#EF8080; --bad-soft:#3B1D24;
    --c1:#F0A257; --c2:#6E9BF0; --c3:#A88BF0; --c4:#EE7BAA; --c5:#4FC9B6; --c6:#F07E73; --c7:#5CC48A; --c8:#D1A660; --c9:#6DC5E6; --c10:#A3A8C4;
    --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1022; --surface:#161A31; --surface-2:#20253F; --line:#2A3050;
  --ink:#ECEEF8; --ink-2:#B7BBD4; --muted:#8A8FAE;
  --primary:#94A4F5; --primary-soft:#232A55; --on-primary:#0D1022;
  --gold:#EFB25A; --gold-soft:#382B16;
  --ok:#5FCB98; --ok-soft:#14352A; --warn:#EFB25A; --warn-soft:#382B16; --bad:#EF8080; --bad-soft:#3B1D24;
  --c1:#F0A257; --c2:#6E9BF0; --c3:#A88BF0; --c4:#EE7BAA; --c5:#4FC9B6; --c6:#F07E73; --c7:#5CC48A; --c8:#D1A660; --c9:#6DC5E6; --c10:#A3A8C4;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}
/* the app's own Clair / Sombre switch wins over the system and the host */
:root[data-mode="light"]{
  --bg:#F1F2F7; --surface:#FFFFFF; --surface-2:#E8EAF3; --line:#DCDFEA;
  --ink:#151935; --ink-2:#464B6B; --muted:#767B99;
  --primary:#2C3B8F; --primary-soft:#E3E7F8; --on-primary:#FFFFFF;
  --gold:#B97A1C; --gold-soft:#FAEBD2;
  --ok:#1E7B56; --ok-soft:#DCF0E6; --warn:#B26D12; --warn-soft:#F9EAD2; --bad:#B23B3B; --bad-soft:#F6DFDF;
  --c1:#D9822B; --c2:#2F6FD1; --c3:#7B5BC9; --c4:#C2457A; --c5:#1F9A8A; --c6:#D2493F; --c7:#2E8B57; --c8:#A0752E; --c9:#2E95BC; --c10:#7C819E;
  --scrim:rgba(12,14,34,.48); --shadow:0 1px 2px rgba(21,25,53,.05),0 6px 18px rgba(21,25,53,.06);
  color-scheme:light;
}
:root[data-mode="dark"]{
  --bg:#0D1022; --surface:#161A31; --surface-2:#20253F; --line:#2A3050;
  --ink:#ECEEF8; --ink-2:#B7BBD4; --muted:#8A8FAE;
  --primary:#94A4F5; --primary-soft:#232A55; --on-primary:#0D1022;
  --gold:#EFB25A; --gold-soft:#382B16;
  --ok:#5FCB98; --ok-soft:#14352A; --warn:#EFB25A; --warn-soft:#382B16; --bad:#EF8080; --bad-soft:#3B1D24;
  --c1:#F0A257; --c2:#6E9BF0; --c3:#A88BF0; --c4:#EE7BAA; --c5:#4FC9B6; --c6:#F07E73; --c7:#5CC48A; --c8:#D1A660; --c9:#6DC5E6; --c10:#A3A8C4;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:10px}
h1,h2,h3{text-wrap:balance}
.ar{font-family:var(--font-ar)}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(100px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:12px 10px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.logo{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--primary);color:var(--on-primary);font-family:var(--font-display);font-weight:700;font-size:17px;overflow:hidden;box-shadow:0 0 0 2px var(--gold)}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.brand b{font-family:var(--font-display);font-weight:700;font-size:21px;color:var(--primary);letter-spacing:.06em;direction:ltr}
.brand span[lang]{font-family:var(--font-ar);font-size:19px;color:var(--gold);white-space:nowrap}
.top-r{display:flex;align-items:center;gap:6px;flex:none}
.sync{display:flex;align-items:center;padding:0 4px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync[data-m="cloud"] i{background:var(--ok)}
.sync[data-m="local"] i{background:var(--gold)}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);flex:none}
.icon-btn svg{width:19px;height:19px}
.lang-btn{font-weight:800;font-size:13px;letter-spacing:.02em}
.lang-btn.to-ar{font-family:var(--font-ar);font-size:19px;font-weight:700;letter-spacing:0;padding-bottom:3px}
.banner{font-size:13px;color:var(--ink-2);background:var(--gold-soft);border-radius:12px;padding:10px 12px;margin-bottom:12px}

#view{display:flex;flex-direction:column;gap:22px}
.sec{display:flex;flex-direction:column;gap:10px}
.h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.h h2{font-family:var(--font-display);font-weight:600;font-size:18px;margin:0;letter-spacing:.005em}
.link{color:var(--primary);font-weight:700;font-size:13px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
.sub{font-size:13px;color:var(--muted)}
.card{background:var(--surface);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow)}
.empty{border:1.5px dashed var(--line);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;color:var(--ink-2);font-size:14px}
.empty strong{color:var(--ink);font-size:15px}

.greet{display:flex;flex-direction:column;gap:2px;padding-top:2px}
.greet .salam{font-family:var(--font-display);font-size:24px;font-weight:600;line-height:1.3}
.greet .date{font-size:13.5px;color:var(--ink-2)}
.greet .date b{color:var(--gold);font-weight:700}

.hero{border-radius:24px;padding:16px 16px 14px;color:var(--sky-ink);background:var(--sky-night);position:relative;overflow:hidden}
.hero[data-p="dawn"]{background:var(--sky-dawn)}
.hero[data-p="day"]{background:var(--sky-day)}
.hero[data-p="dusk"]{background:var(--sky-dusk)}
.hero-top{display:flex;justify-content:space-between;gap:10px;opacity:.85}
.next{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:6px}
.next-ar{font-family:var(--font-ar);font-size:34px;line-height:1.2}
.next-fr{font-family:var(--font-display);font-size:16px;font-weight:600;opacity:.9}
.next .r{text-align:end}
.next .time{font-family:var(--font-display);font-size:44px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.next .count{font-size:13.5px;font-weight:700;color:var(--sky-accent);margin-top:4px}
.hero svg{display:block;width:100%;height:auto;margin-top:6px}
.arc-fill{fill:var(--sky-faint)}
.arc{fill:none;stroke:var(--sky-line);stroke-width:1.4}
.horizon{stroke:var(--sky-line);stroke-width:1;stroke-dasharray:2 4}
.mk{fill:var(--sky-ink);opacity:.85}
.mk.nx{fill:var(--sky-accent);opacity:1}
.sun{fill:var(--sky-accent)}
.sun-glow{fill:var(--sky-accent);opacity:.28}
.moon{fill:var(--sky-ink)}
.ptimes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin-top:4px;text-align:center}
.ptimes div{font-size:11px;opacity:.78;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptimes strong{display:block;font-size:14.5px;font-variant-numeric:tabular-nums}
.ptimes .is-next{opacity:1;color:var(--sky-accent)}

.pills{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.pill{display:flex;flex-direction:column;align-items:center;gap:6px;padding:11px 2px 10px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-size:11.5px;font-weight:700;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:26px;height:26px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;color:var(--on-primary);flex:none}
.dot svg{width:14px;height:14px}
[data-s="jamaa"] .dot{background:var(--ok);border:0}
[data-s="ontime"] .dot{background:var(--primary);border:0}
[data-s="late"] .dot{background:var(--warn);border:0}
[data-s="missed"] .dot{background:var(--bad);border:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%}

.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;display:block}
.bar>i{display:block;height:100%;width:var(--w,0%);background:var(--fill,var(--primary));border-radius:inherit;transition:width .3s ease}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mini{background:var(--surface);border-radius:var(--r-md);padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;min-width:0}
.mini .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:700;font-size:14px}
.mini .t small{font-size:12px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.mini .ar{font-size:17px;color:var(--ink-2);line-height:1.3}
.list{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);min-width:0;width:100%}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .ttl{font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
.row .meta{font-size:12.5px;color:var(--muted)}
.check{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:var(--on-primary)}
.check svg{width:14px;height:14px;opacity:0}
[aria-pressed="true"] .check,.check.on{background:var(--ok);border-color:var(--ok)}
[aria-pressed="true"] .check svg,.check.on svg{opacity:1}
.ttl.done{text-decoration:line-through;color:var(--muted)}
.week7{display:flex;gap:3px;flex:none}
.week7 i{width:7px;height:7px;border-radius:50%;background:var(--surface-2)}
.week7 i.on{background:var(--ok)}

.ctx{background:var(--gold-soft);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:10px}
.ctx h3{margin:0;font-family:var(--font-display);font-weight:600;font-size:17px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.ctx h3 .ar{font-size:20px;color:var(--gold);font-weight:700}
.ctx p{margin:0;font-size:13.5px;color:var(--ink-2)}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:8px 13px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:700;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.chip .sw{width:10px;height:10px;border-radius:50%;background:var(--sw)}
.chip.ar{font-size:16px;padding:5px 13px 7px}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.seg::-webkit-scrollbar{display:none}
.seg .chip{flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:14px;font-weight:700;font-size:14px;background:var(--surface-2);color:var(--ink)}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.soft{background:var(--primary-soft);color:var(--primary)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1 1 auto}

.prow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow.now{background:var(--primary-soft)}
.prow .nm{display:flex;align-items:baseline;gap:10px;min-width:0}
.prow .nm .ar{font-size:21px;line-height:1.3}
.prow .nm span{font-weight:700;font-size:14px;color:var(--ink-2)}
.prow .tm{font-family:var(--font-display);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.prow.info{opacity:.75}
.prow .note{min-width:118px;text-align:end}
.sbtn{display:flex;align-items:center;gap:8px;padding-block:6px;padding-inline:6px 10px;border-radius:99px;background:var(--surface-2);font-size:12px;font-weight:700;color:var(--ink-2);min-width:118px}
.sbtn .dot{width:24px;height:24px}
.grid7{display:grid;grid-template-columns:auto repeat(7,minmax(0,1fr));gap:6px 4px;align-items:center;font-size:11.5px}
.grid7 .hd{text-align:center;font-weight:700;color:var(--muted)}
.grid7 .hd.today{color:var(--primary)}
.grid7 .lb{font-weight:700;color:var(--ink-2);padding-inline-end:4px}
.grid7 button{display:grid;place-items:center;padding:3px 0}
.grid7 .dot{width:22px;height:22px}
.grid7 button:disabled{opacity:.35;cursor:default}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border-radius:var(--r-md);padding:12px;box-shadow:var(--shadow);min-width:0}
.stat b{display:block;font-family:var(--font-display);font-size:26px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.qada{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.qada b{font-family:var(--font-display);font-size:28px;font-weight:600}
.stepper{display:flex;gap:6px}
.stepper button{width:40px;height:40px;border-radius:12px;background:var(--surface-2);font-weight:800;font-size:18px}

.ath-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.ath-head h2{margin:0;font-family:var(--font-display);font-size:22px;font-weight:600;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ath-head h2 .ar{font-size:22px;color:var(--gold);font-weight:700}
.ath-head p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.ath-prog{font-family:var(--font-display);font-size:22px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.dl{display:flex;flex-direction:column;gap:10px}
.dhikr{background:var(--surface);border-radius:18px;padding:16px;border:1px solid var(--line);display:flex;flex-direction:column;gap:10px;width:100%;transition:background .2s ease}
.dhikr .tx{font-family:var(--font-ar);font-size:22px;line-height:2.05;direction:rtl;text-align:right;color:var(--ink);white-space:pre-line;display:block}
.dhikr .fr{font-size:13px;color:var(--ink-2);display:block}
.dhikr .ft{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dhikr .note{font-size:12px;color:var(--muted);font-weight:600}
.ring{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;color:var(--primary);font-variant-numeric:tabular-nums;flex:none}
.ring svg{width:38px;height:38px;transform:rotate(-90deg)}
.ring .bg{fill:none;stroke:var(--surface-2);stroke-width:4}
.ring .fg{fill:none;stroke:var(--primary);stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .2s ease}
.dhikr.done{background:var(--ok-soft);border-color:transparent}
.dhikr.done .tx{color:var(--ink-2)}
.dhikr.done .ring{color:var(--ok)}
.dhikr.done .ring .fg{stroke:var(--ok)}
.dhikr:active{transform:scale(.995)}

.tsb{display:flex;flex-direction:column;align-items:center;gap:16px;padding-top:4px}
.tsb .which{text-align:center}
.tsb .which .ar{font-size:30px;line-height:1.5}
.tsb .which div{font-size:13px;color:var(--muted);font-weight:600}
.bead{width:min(250px,72vw);max-width:100%;aspect-ratio:1;border-radius:50%;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);display:grid;place-items:center;position:relative;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.bead:active{transform:scale(.97)}
.bead svg{position:absolute;inset:8px;width:calc(100% - 16px);height:calc(100% - 16px);transform:rotate(-90deg)}
.bead .bg{fill:none;stroke:var(--surface-2);stroke-width:5}
.bead .fg{fill:none;stroke:var(--gold);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .15s ease}
.bead .n{font-family:var(--font-display);font-size:68px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.bead .of{font-size:13px;color:var(--muted);font-weight:700;text-align:center}
.tsb .tot{font-size:13px;color:var(--ink-2)}

.mnav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mnav h2{font-family:var(--font-display);font-size:20px;font-weight:600;margin:0;text-transform:capitalize}

/* ================= time & astronomy ================= */
const dtr=d=>d*Math.PI/180, rtd=r=>r*180/Math.PI;
const sin=d=>Math.sin(dtr(d)), cos=d=>Math.cos(dtr(d)), tan=d=>Math.tan(dtr(d));
const arcsin=x=>rtd(Math.asin(x)), arccos=x=>rtd(Math.acos(x)), arctan2=(y,x)=>rtd(Math.atan2(y,x)), arccot=x=>rtd(Math.atan(1/x));
const fixA=(a,b)=>{a=a-b*Math.floor(a/b);return a<0?a+b:a};
const fixAngle=a=>fixA(a,360), fixHour=a=>fixA(a,24);
function julian(y,m,d){if(m<=2){y-=1;m+=12}const A=Math.floor(y/100),Bq=2-A+Math.floor(A/4);return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+Bq-1524.5}
function sunPos(jd){const D=jd-2451545.0;const g=fixAngle(357.529+0.98560028*D);const q=fixAngle(280.459+0.98564736*D);const Lg=fixAngle(q+1.915*sin(g)+0.020*sin(2*g));const e=23.439-0.00000036*D;const RA=arctan2(cos(e)*sin(Lg),cos(Lg))/15;return{decl:arcsin(sin(e)*sin(Lg)),eqt:q/15-fixHour(RA)}}
function calcTimes(y,m,d,lat,lng,tz,M,asrF,tune){
  const jd=julian(y,m,d)-lng/(15*24);
  const mid=t=>fixHour(12-sunPos(jd+t).eqt);
  const at=(a,t,ccw)=>{const s=sunPos(jd+t);const n=mid(t);const T=arccos((-sin(a)-sin(s.decl)*sin(lat))/(cos(s.decl)*cos(lat)))/15;return n+(ccw?-T:T)};
  const asrT=(f,t)=>{const s=sunPos(jd+t);return at(-arccot(f+tan(Math.abs(lat-s.decl))),t)};
  let t={fajr:5,sunrise:6,dhuhr:12,asr:13,maghrib:18,isha:18};
  for(let i=0;i<2;i++){
    const p={};for(const k in t)p[k]=(isNaN(t[k])?12:t[k])/24;
    t={fajr:at(M.fajr,p.fajr,true),sunrise:at(0.833,p.sunrise,true),dhuhr:mid(p.dhuhr),asr:asrT(asrF,p.asr),maghrib:at(0.833,p.maghrib),isha:M.ishaMin?18:at(M.isha,p.isha)};
  }
  for(const k in t)t[k]+=tz-lng/15;
  if(M.ishaMin)t.isha=t.maghrib+M.ishaMin/60;
  const night=fixHour(t.sunrise-t.maghrib);
  const fp=M.fajr/60*night; if(isNaN(t.fajr)||fixHour(t.sunrise-t.fajr)>fp)t.fajr=t.sunrise-fp;
  if(!M.ishaMin){const ip=M.isha/60*night; if(isNaN(t.isha)||fixHour(t.isha-t.maghrib)>ip)t.isha=t.maghrib+ip;}
  for(const k in t)t[k]+=(+tune[k]||0)/60;
  return t;
}
const tzCache={};
function tzOffset(zone,date){
  const key=zone+'|'+Math.floor(date.getTime()/3600000);
  if(tzCache[key]!==undefined)return tzCache[key];
  let v;
  try{
    const f=new Intl.DateTimeFormat('en-US',{timeZone:zone,hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric'});
    const p={};for(const x of f.formatToParts(date))p[x.type]=x.value;
    const asUTC=Date.UTC(+p.year,+p.month-1,+p.day,(+p.hour)%24,+p.minute);
    const base=Math.floor(date.getTime()/60000)*60000;
    v=Math.round((asUTC-base)/60000)/60;
    if(isNaN(v))throw 0;
  }catch(e){v=-date.getTimezoneOffset()/60}
  return tzCache[key]=v;
}
function deviceZone(){try{return Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC'}catch(e){return 'UTC'}}
function cityInfo(){
  const p=S.profile;
  if(p.cityId==='custom'&&p.custom&&isFinite(+p.custom.lat)&&isFinite(+p.custom.lng))return{id:'custom',name:'Ma position',ar:'موقعي',lat:+p.custom.lat,lng:+p.custom.lng,zone:deviceZone()};
  return CITIES.find(c=>c.id===p.cityId)||CITIES[0];
}
const cityName=c=>L(c.name,c.ar||c.name);
const keyOf=(y,m,d)=>y+'-'+pad(m)+'-'+pad(d);
const parseKey=k=>{const a=k.split('-').map(Number);return{y:a[0],m:a[1],d:a[2]}};
const kdate=k=>{const p=parseKey(k);return new Date(Date.UTC(p.y,p.m-1,p.d,12))};
function addDays(k,n){const p=parseKey(k);const t=new Date(Date.UTC(p.y,p.m-1,p.d+n));return keyOf(t.getUTCFullYear(),t.getUTCMonth()+1,t.getUTCDate())}
function dow(k){const p=parseKey(k);return new Date(Date.UTC(p.y,p.m-1,p.d)).getUTCDay()}
function daysBetween(a,b){const A=parseKey(a),Bk=parseKey(b);return Math.round((Date.UTC(Bk.y,Bk.m-1,Bk.d)-Date.UTC(A.y,A.m-1,A.d))/86400000)}
function now(){
  const c=cityInfo();const n=new Date();const tz=tzOffset(c.zone,n);
  const s=new Date(n.getTime()+tz*3600000);
  const y=s.getUTCFullYear(),m=s.getUTCMonth()+1,d=s.getUTCDate();
  return{y,m,d,key:keyOf(y,m,d),mk:y+'-'+pad(m),h:s.getUTCHours()+s.getUTCMinutes()/60+s.getUTCSeconds()/3600,dow:s.getUTCDay(),city:c};
}
const ptCache=new Map();
function prayerTimes(k){
  const p=S.profile,c=cityInfo();
  const ck=[k,c.lat,c.lng,c.zone,p.method,p.asr,JSON.stringify(p.tune)].join('|');
  if(ptCache.has(ck))return ptCache.get(ck);
  const {y,m,d}=parseKey(k);
  const tz=tzOffset(c.zone,new Date(Date.UTC(y,m-1,d,12)));
  const r=calcTimes(y,m,d,c.lat,c.lng,tz,METHODS[p.method]||METHODS.mwl,+p.asr===2?2:1,p.tune||{});
  if(ptCache.size>200)ptCache.clear();
  ptCache.set(ck,r);return r;
}

const pn=(k,dayKey)=>{const o=pname(k,dayKey);return L(o.fr,o.ar)};

let HFMT=null;
function hfmt(){
  if(HFMT!==null)return HFMT;
  for(const cal of ['islamic-umalqura','islamic-civil','islamic']){
    try{const f=new Intl.DateTimeFormat('en-u-ca-'+cal+'-nu-latn',{day:'numeric',month:'numeric',year:'numeric',timeZone:'UTC'});if(String(f.resolvedOptions().calendar||'').indexOf('islamic')===0)return HFMT=f}catch(e){}
  }
  return HFMT=false;
}
function hijri(k){
  const f=hfmt();if(!f)return null;
  const p=parseKey(k);const dt=new Date(Date.UTC(p.y,p.m-1,p.d,12)+(+S.profile.hijriAdj||0)*86400000);
  const o={};for(const x of f.formatToParts(dt))o[x.type]=x.value;
  const r={d:parseInt(o.day,10),m:parseInt(o.month,10),y:parseInt(o.year,10)};
  return (isNaN(r.d)||isNaN(r.m)||isNaN(r.y)||r.m<1||r.m>12)?null:r;
}
function hijriStr(k){const h=hijri(k);if(!h)return '';return isAr()?(h.d+' '+HM[h.m-1][1]+' '+h.y+' هـ'):(h.d+' '+HM[h.m-1][0]+' '+h.y)}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function fmtLong(k){return cap(dfmt('long',{weekday:'long',day:'numeric',month:'long'}).format(kdate(k)))}
function fmtShort(k){return isAr()?dfmt('shortA',{day:'numeric',month:'long'}).format(kdate(k)):dfmt('short',{day:'numeric',month:'short'}).format(kdate(k))}
function fmtMonth(mk){const a=mk.split('-');return dfmt('month',{month:'long',year:'numeric'}).format(new Date(Date.UTC(+a[0],+a[1]-1,15)))}
function dayLabel(k){return cap(dfmt('dl',{weekday:'long'}).format(kdate(k)))+' '+fmtShort(k)}

function fastInfo(k){
  const h=hijri(k),w=dow(k),out=[];
  if(h){
    if((h.m===10&&h.d===1)||(h.m===12&&h.d>=10&&h.d<=13))return{forbidden:true,list:[]};
    if(h.m===9)out.push('ramadan');

const LS_KEY='barakah.v1';
function lsGet(){try{const r=localStorage.getItem(LS_KEY);return r?JSON.parse(r):null}catch(e){return null}}
function lsSaveAll(){try{localStorage.setItem(LS_KEY,JSON.stringify({profile:S.profile,days:S.days,months:S.months,projects:S.projects,finance:S.finance}))}catch(e){}}
function refFor(path){
  if(path==='profile')return B.ref;
  const i=path.indexOf('/');return B.ref.collection(path.slice(0,i)).doc(path.slice(i+1));
}
function dataFor(path){
  if(path==='profile')return S.profile;
  const i=path.indexOf('/'),kind=path.slice(0,i),id=path.slice(i+1);
  const box=kind==='days'?S.days:kind==='months'?S.months:kind==='finance'?S.finance:S.projects;
  return box[id]||null;
}
const Q={};
function persist(path,delay){
  const q=Q[path]||(Q[path]={t:null,busy:false,dirty:false});
  q.dirty=true;clearTimeout(q.t);
  q.t=setTimeout(()=>flush(path),delay==null?500:delay);
}
async function flush(path){
  const q=Q[path];if(!q||q.busy||!q.dirty)return;
  clearTimeout(q.t);
  if(B.mode==='loading'||(B.mode==='cloud'&&!S.loaded)){q.t=setTimeout(()=>flush(path),800);return}
  q.dirty=false;q.busy=true;
  try{
    if(B.mode==='cloud'){
      const data=dataFor(path);const ref=refFor(path);
      if(data==null)await ref.delete();else await ref.set(clone(data));
    }else lsSaveAll();
  }catch(e){writeError(e)}
  finally{q.busy=false;if(q.dirty)flush(path)}
}
function flushAll(){for(const p in Q){if(Q[p].dirty)flush(p)}}
function isBusy(path){const q=Q[path];return !!(q&&(q.busy||q.dirty))}
function writeError(e){
  const c=e&&e.code;
  if(c==='quota_exceeded')toast(L('Espace plein : supprime d’anciennes données pour continuer.','المساحة ممتلئة: احذف بيانات قديمة للمتابعة.'));
  else if(c==='invalid_argument'){toast(L('Enregistrement refusé sur ce compte. Tes changements restent sur cet appareil.','تعذّر الحفظ في هذا الحساب. تبقى تغييراتك على هذا الجهاز.'));if(B.mode==='cloud')startLocal(true)}
  else if(c==='revoked'){toast(L('Accès retiré. Mode local activé.','سُحب الوصول. تم تفعيل الوضع المحلي.'));startLocal(true)}
  else toast(L('Enregistrement impossible pour le moment. Réessaie.','تعذّر الحفظ حاليًا. حاول مجددًا.'));
}
async function initBackend(){
  if(!window.claude||typeof window.claude.use!=='function'){startLocal();return}
  let db=null,user=null;
  try{[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')])}catch(e){}
  let uid=null;
  try{uid=user?await user.id():null}catch(e){}
  if(!db||!uid){startLocal();lightExtras();return}
  B.db=db;B.uid=uid;B.mode='cloud';
  try{B.ref=db.doc('data/users/'+uid+'/profile')}catch(e){startLocal();lightExtras();return}
  setSync();
  const seen={profile:false,days:false,months:false,projects:false,finance:false};
  const mark=k=>{if(!seen[k]){seen[k]=true;if(Object.values(seen).every(Boolean)){S.loaded=true;setTimeout(applyRecurring,0)}}};
  const onErr=e=>{if(e&&e.code==='revoked'){startLocal(true)}else{console.warn('db',e)}};
  B.ref.onSnapshot(s=>{
    const server=s.exists?clone(s.data()):null;
    if(!isBusy('profile'))S.profile=normProfile(server);
    else if(!seen.profile&&server)S.profile=normProfile(deepMerge(server,S.profile));
    ptCache.clear();mark('profile');rerender();
  },onErr);
  const cutoff=addDays(now().key,-62);
  B.ref.collection('days').where('date','>=',cutoff).onSnapshot(qs=>applyChanges(qs,'days',S.days,seen,mark),onErr);
  B.ref.collection('months').onSnapshot(qs=>applyChanges(qs,'months',S.months,seen,mark),onErr);
  B.ref.collection('projects').onSnapshot(qs=>applyChanges(qs,'projects',S.projects,seen,mark),onErr);
  B.ref.collection('finance').onSnapshot(qs=>applyChanges(qs,'finance',S.finance,seen,mark),onErr);
  lightExtras();
}
function deepMerge(a,b){
  if(!b||typeof b!=='object'||Array.isArray(b))return b;
  const o=(a&&typeof a==='object'&&!Array.isArray(a))?a:{};
  for(const k in b){o[k]=(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k]))?deepMerge(o[k],b[k]):b[k]}
  return o;
}
function applyChanges(qs,kind,box,seen,mark){
  const first=!seen[kind];
  for(const ch of qs.docChanges()){
    const id=ch.doc.id;
    if(isBusy(kind+'/'+id)){
      if(first&&ch.type!=='removed'&&box[id])box[id]=deepMerge(clone(ch.doc.data()),box[id]);
      continue;
    }
    if(ch.type==='removed')delete box[id];else box[id]=clone(ch.doc.data());
  }
  mark(kind);rerender();
}
function startLocal(fromCloud){
  B.mode='local';
  if(!fromCloud){
    const d=lsGet();
    if(d){S.profile=normProfile(d.profile);S.days=d.days||{};S.months=d.months||{};S.projects=d.projects||{};S.finance=d.finance||{}}
  }else lsSaveAll();
  S.loaded=true;ptCache.clear();setSync();applyRecurring();rerender();
}
async function lightExtras(){
  if(!window.claude||typeof window.claude.use!=='function')return;
  try{B.sample=await window.claude.use('sample')}catch(e){B.sample=null}
  try{B.downloads=await window.claude.use('downloads')}catch(e){B.downloads=null}

}

function durText(hh){const mins=Math.max(0,Math.round(hh*60)),h=Math.floor(mins/60),m=mins%60;return isAr()?(h?h+' س '+pad(m)+' د':m+' دقيقة'):(h?h+' h '+pad(m):m+' min')}
function prayerWindow(n){
  const t=prayerTimes(n.key),h=n.h;
  const W=(k,start,end,endK)=>({k,start,end,endK,left:end-h,frac:clamp((h-start)/(end-start),0,1)});
  const nightOf=(mg,fj)=>{const len=fj-mg;return{third:mg+len/3,last:fj-len/3,fj}};
  if(h<t.fajr){
    const y=prayerTimes(addDays(n.key,-1)),N=nightOf(y.maghrib-24,t.fajr);
    if(h<N.third)return W('isha',y.isha-24,N.third,'third');
    return {k:h>=N.last?'last':'night',left:t.fajr-h};
  }
  if(h<t.sunrise)return W('fajr',t.fajr,t.sunrise,'sunrise');
  if(h<t.dhuhr)return {k:'duha',left:t.dhuhr-h};
  if(h<t.asr)return W('dhuhr',t.dhuhr,t.asr,'asr');
  if(h<t.maghrib)return W('asr',t.asr,t.maghrib,'maghrib');
  if(h<t.isha)return W('maghrib',t.maghrib,t.isha,'isha');
  const N=nightOf(t.maghrib,prayerTimes(addDays(n.key,1)).fajr+24);
  if(h<N.third)return W('isha',t.isha,N.third,'third');
  return {k:h>=N.last?'last':'night',left:N.fj-h};
}

function arcSVG(n,t,nxk){
  const W=320,H=96,hy=72,A=54;
  const t0=t.fajr-0.6,t1=t.isha+0.6;
  const X=h=>14+(clamp(h,t0,t1)-t0)/(t1-t0)*(W-28);
  const sr=t.sunrise,ss=t.maghrib;
  const Y=h=>(h>=sr&&h<=ss)?hy-A*Math.sin(Math.PI*(h-sr)/(ss-sr)):hy;
  let dp='';for(let i=0;i<=56;i++){const h=sr+(ss-sr)*i/56;dp+=(i?'L':'M')+X(h).toFixed(1)+' '+Y(h).toFixed(1)}
  const marks=['fajr','sunrise','dhuhr','asr','maghrib','isha'].map(k=>`<circle class="mk${k===nxk?' nx':''}" cx="${X(t[k]).toFixed(1)}" cy="${Y(t[k]).toFixed(1)}" r="${k===nxk?4.5:(k==='sunrise'?2:3)}"/>`).join('');
  let cur='';const h=n.h;
  if(h>=sr&&h<=ss){const x=X(h).toFixed(1),y=Y(h).toFixed(1);cur=`<circle class="sun-glow" cx="${x}" cy="${y}" r="12"/><circle class="sun" cx="${x}" cy="${y}" r="6.5"/>`}
  else{const x=X(h),y=hy+12;cur=`<mask id="moonm"><rect x="0" y="0" width="${W}" height="${H}" fill="#fff"/><circle cx="${(x+3).toFixed(1)}" cy="${(y-2.2).toFixed(1)}" r="5.2" fill="#000"/></mask><circle class="moon" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="6" mask="url(#moonm)"/>`}
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${L('Course du soleil et horaires de prière','مسار الشمس ومواقيت الصلاة')}"><path class="arc-fill" d="${dp}Z"/><line class="horizon" x1="6" y1="${hy}" x2="${W-6}" y2="${hy}"/><path class="arc" d="${dp}"/>${marks}${cur}</svg>`;
}

function applyRecurring(){

  const d=day(k);d.prayers=d.prayers||{};const prev=d.prayers[p]||'';

  const pr=S.profile;

function aiErr(e){const c=e&&e.code;if(c==='not_granted')return L('Tu n’as pas autorisé Claude sur cette page.','لم تسمح لـ Claude في هذه الصفحة.');if(c==='rate_limited')return L('Trop de demandes d’un coup. Réessaie dans une minute.','طلبات كثيرة دفعة واحدة. حاول بعد دقيقة.');if(c==='cancelled')return '';return L('Claude n’a pas pu répondre cette fois. Réessaie plus tard.','تعذّر على Claude الرد هذه المرة. حاول لاحقًا.')}
function mini(md){
  const lines=esc(md).split('\n');let h='',ul=false;
  for(let l of lines){
    l=l.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    const m=l.match(/^\s*[-•*]\s+(.*)/);
    if(m){if(!ul){h+='<ul>';ul=true}h+='<li>'+m[1]+'</li>'}
    else{if(ul){h+='</ul>';ul=false}if(l.trim())h+='<p>'+l.replace(/^#+\s*/,'')+'</p>'}
  }
  if(ul)h+='</ul>';return h;
}

function saveSettings(f){
  const p=S.profile;
  p.name=f.name.value.trim().slice(0,40);
  p.cityId=f.city.value;
  const lat=parseAmt(f.lat.value),lng=parseAmt(f.lng.value);
  if(p.cityId==='custom'){
    if(!(isFinite(lat)&&isFinite(lng)&&Math.abs(lat)<=66&&Math.abs(lng)<=180)){toast(L('Entre une latitude et une longitude valides.','أدخل خط عرض وخط طول صحيحين.'));return}
    p.custom={lat,lng};
  }else if(isFinite(lat)&&isFinite(lng))p.custom={lat,lng};
  p.method=f.method.value;p.asr=+f.asr.value===2?2:1;
  for(const k of ['fajr','sunrise','dhuhr','asr','maghrib','isha']){const v=parseInt(f['tune_'+k].value,10);p.tune[k]=isFinite(v)?clamp(v,-60,60):0}
  p.hijriAdj=clamp(parseInt(f.hadj.value,10)||0,-2,2);
  p.currency=(f.cur.value.trim()||'UM').slice(0,6);
  const total=clamp(parseInt(f.total.value,10)||604,1,2000);
  p.quran.total=total;p.quran.goal=clamp(parseInt(f.goal.value,10)||1,1,total);p.quran.page=clamp(parseInt(f.page.value,10)||1,1,total);
  const names=f.habits.value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,12);
  const old=p.habits||[];
  p.habits=names.map(nm=>{const o=old.find(h=>habitName(h)===nm);return o?o:{id:'h'+rid(),name:nm.slice(0,50)}});
  ptCache.clear();persist('profile',100);closeSheet();rerender();toast(L('Réglages enregistrés','تم حفظ الإعدادات'));

function openReader(set){

}
function closeReader(){S.reader=null;$('#reader').hidden=true;if(!S.sheet)document.body.style.overflow='';wake(false);render()}
function renderReader(){
  const R=S.reader;if(!R)return;
  const A=ATHKAR[R.set],k=now().key,a=(day(k).athkar&&day(k).athkar[R.set])||{},it=A.items[R.i],c=Math.min(a[R.i]||0,it.n),pr=athProgress(R.set,k),note=isAr()?(it.an||''):it.fr;
  $('#reader').innerHTML=`<div class="rh"><button class="icon-btn" data-act="reader-close" aria-label="${L('Fermer','إغلاق')}">${IC.x}</button><b>${isAr()?A.ar:A.fr}</b><span class="rp">${pr.done}/${pr.total}</span></div>

      <div style="text-align:center"><div class="rcount">${c} / ${it.n}</div><div class="sub">${pr.done===pr.total?L('Série terminée','اكتملت السلسلة'):L('Touche le texte pour compter','المس النص للعدّ')}</div></div>
      <button class="icon-btn" data-act="reader-next" aria-label="${L('Suivant','التالي')}" ${R.i>=A.items.length-1?'disabled':''}>${IC.right}</button></div>`;

function readerTap(){
  const R=S.reader;if(!R)return;
  const k=now().key,d=day(k);d.athkar=d.athkar||{};const a=d.athkar[R.set]=d.athkar[R.set]||{};
  const items=ATHKAR[R.set].items,it=items[R.i],c=a[R.i]||0;
  if(c>=it.n){if(R.i<items.length-1){R.i++;renderReader()}return}
  a[R.i]=c+1;touchDay(k,900);const done=a[R.i]>=it.n;vibrate(done?35:8);
  renderReader();
  if(done){
    const pr=athProgress(R.set,k);
    if(pr.done===pr.total)toast(L('Série terminée. BârakAllahu fîk !','اكتملت السلسلة. بارك الله فيك!'));
    else{const at=R.i;setTimeout(()=>{if(S.reader!==R||R.i!==at)return;let j=items.findIndex((x,jj)=>jj>R.i&&(a[jj]||0)<x.n);if(j<0)j=items.findIndex((x,jj)=>(a[jj]||0)<x.n);if(j>=0){R.i=j;renderReader()}},450)}
  }
}

function quranAdd(n){
  const k=now().key,d=day(k),q=S.profile.quran,total=Math.max(1,+q.total||604);
  const cur=+d.quran||0;if(n<0&&cur<=0)return;
  d.quran=Math.max(0,cur+n);
  let page=(+q.page||1)+n;
  if(page>total){q.khatmas=(+q.khatmas||0)+1;page=page-total;toast(L('Khatma terminée. Qu’Allah l’accepte !','ختمة مكتملة. تقبّل الله!'));vibrate([30,60,30])}
  if(page<1)page=1;
  q.page=page;
  touchDay(k,300);persist('profile',300);rerender();
}
function tapDhikr(set,i,el){
  const k=now().key,d=day(k);d.athkar=d.athkar||{};const a=d.athkar[set]=d.athkar[set]||{};
  const it=ATHKAR[set].items[i];const c=a[i]||0;if(c>=it.n)return;
  a[i]=c+1;const done=a[i]>=it.n;
  vibrate(done?35:8);touchDay(k,900);
  el.classList.toggle('done',done);
  $('.cnt',el).textContent=a[i]+' / '+it.n;
  $('.fg',el).setAttribute('stroke-dashoffset',(RC*(1-a[i]/it.n)).toFixed(2));
  el.setAttribute('aria-label',L('Répétition '+a[i]+' sur '+it.n,'التكرار '+a[i]+' من '+it.n));
  const pr=athProgress(set,k);const dn=$('#ath-done'),bar=$('#ath-bar');
  if(dn)dn.textContent=pr.done;if(bar)bar.style.setProperty('--w',(pr.done/pr.total*100)+'%');
  if(done){
    const cards=$$('.dhikr');const next=cards.find((c2,j)=>j>i&&!c2.classList.contains('done'));
    if(next)setTimeout(()=>next.scrollIntoView({behavior:reduced()?'auto':'smooth',block:'center'}),180);
    else if(pr.done===pr.total)toast(L('Série terminée. BârakAllahu fîk !','اكتملت السلسلة. بارك الله فيك!'));
  }
}
function tapTasbih(){
  const T=S.tsb,k=now().key,d=day(k);
  T.n++;d.tasbih=(+d.tasbih||0)+1;d.tsbBy=d.tsbBy||{};d.tsbBy[T.i]=(+d.tsbBy[T.i]||0)+1;
  touchDay(k,1200);
  const hit=T.target&&T.n===T.target;vibrate(hit?[40,60,40]:6);
  const ring=2*Math.PI*46,frac=T.target?Math.min(1,T.n/T.target):((T.n%100)/100);
  const r=$('#tsb-ring');if(r)r.setAttribute('stroke-dashoffset',(ring*(1-frac)).toFixed(2));
  const nn=$('#tsb-n');if(nn)nn.textContent=T.n;
  const of=$('#tsb-of');if(of)of.textContent=tsbOf(T);
  const tt=$('#tsb-tot');if(tt)tt.textContent=d.tasbih;
}

const ARM=new WeakMap();
function armed(btn){
  if(!btn.dataset.confirm)return true;
  if(ARM.get(btn))return true;
  const orig=btn.innerHTML;ARM.set(btn,true);btn.textContent=btn.dataset.confirm;
  setTimeout(()=>{if(document.body.contains(btn)){ARM.delete(btn);btn.innerHTML=orig}},3500);
  return false;
}

    case 'tarawih':{const d=day(n.key);d.tarawih=!d.tarawih;touchDay(n.key,300);b.setAttribute('aria-pressed',String(!!d.tarawih));break}
    case 'journal':sheetJournal(b.dataset.day);break;
    case 'reader-open':openReader(b.dataset.set);break;
    case 'reader-close':closeReader();break;
    case 'reader-tap':readerTap();break;
    case 'reader-prev':if(S.reader&&S.reader.i>0){S.reader.i--;renderReader()}break;
    case 'reader-next':if(S.reader&&S.reader.i<ATHKAR[S.reader.set].items.length-1){S.reader.i++;renderReader()}break;
    case 'set-size':setSize(b.dataset.v);break;
    case 'ram-preview':setRamPreview(!S.ui.ramPreview);break;
    case 'debt-new':sheetDebtForm(null,b.dataset.dir);break;
    case 'debt-open':sheetDebt(b.dataset.id);break;
    case 'debt-edit':sheetDebtForm(b.dataset.id);break;
    case 'debt-close':{const d=fin('debts').items.find(x=>x.id===b.dataset.id);if(d){d.closed=true;persist('finance/debts',100);renderSheet();rerender();toast(L('Dette soldée','تم سداد الدين'))}break}
    case 'debt-reopen':{const d=fin('debts').items.find(x=>x.id===b.dataset.id);if(d){d.closed=false;persist('finance/debts',100);renderSheet();rerender()}break}
    case 'debt-unpay':{const d=fin('debts').items.find(x=>x.id===b.dataset.id);if(d&&d.paid){d.paid.splice(+b.dataset.i,1);persist('finance/debts',100);renderSheet();rerender()}break}
    case 'debt-del':{if(!armed(b))break;const D=fin('debts');D.items=D.items.filter(x=>x.id!==b.dataset.id);persist('finance/debts',50);closeSheet();rerender();toast(L('Supprimé','تم الحذف'));break}
    case 'goal-new':sheetGoalForm(null);break;
    case 'goal-open':S.form={gmove:'add'};sheetGoal(b.dataset.id);break;
    case 'goal-edit':sheetGoalForm(b.dataset.id);break;
    case 'goal-tpl':{const i=$('#g-name');if(i)i.value=b.dataset.v;break}
    case 'goal-unadd':{const g=fin('goals').items.find(x=>x.id===b.dataset.id);if(g&&g.adds){g.adds.splice(+b.dataset.i,1);persist('finance/goals',100);renderSheet();rerender()}break}
    case 'goal-del':{if(!armed(b))break;const G=fin('goals');G.items=G.items.filter(x=>x.id!==b.dataset.id);persist('finance/goals',50);closeSheet();rerender();toast(L('Supprimé','تم الحذف'));break}
    case 'rec-new':sheetRecForm(null);break;
    case 'rec-edit':sheetRecForm(b.dataset.id);break;
    case 'rec-type':{const fo=$('form[data-form="rec"]');if(fo){const f=fields(fo);S.form.init={name:f.name.value,amt:f.amt.value,day:f.day.value}}S.form.type=b.dataset.v;S.form.cat=b.dataset.v==='in'?'salary':'home';renderSheet();break}
    case 'rec-toggle':{const r=fin('recurring').items.find(x=>x.id===b.dataset.id);if(r){r.on=!r.on;if(r.on&&n.d>=(+r.day||1))r.last=n.mk;persist('finance/recurring',200);rerender()}break}
    case 'rec-del':{if(!armed(b))break;const R=fin('recurring'),rid0=S.form.id;R.items=R.items.filter(x=>x.id!==rid0);persist('finance/recurring',50);closeSheet();rerender();toast(L('Supprimé','تم الحذف'));break}
    case 'export':exportData();break;
  }
});
document.addEventListener('submit',e=>{
  const fm=e.target.closest('form[data-form]');if(!fm)return;e.preventDefault();
  const k=fm.dataset.form,f=fields(fm);
  if(k==='tx')saveTx(f);
  else if(k==='budgets'){const b={};for(const c of CATS.out){const v=parseAmt(f[c[0]]?f[c[0]].value:'');if(v>0)b[c[0]]=Math.round(v)}S.profile.budgets=b;persist('profile',100);closeSheet();rerender();toast(L('Budgets enregistrés','تم حفظ الميزانيات'))}
  else if(k==='project')saveProject(f);
  else if(k==='task'){const p=S.projects[fm.dataset.pid];const v=f.t.value.trim();if(!p||!v)return;p.tasks=(p.tasks||[]).concat([{id:rid(),t:v.slice(0,120),done:false}]);p.updated=Date.now();persist('projects/'+p.id,300);renderSheet();rerender();const i=$('#t-new');if(i)try{i.focus()}catch(er){}}
  else if(k==='settings')saveSettings(f);
  else if(k==='journal'){const dk=fm.dataset.day,d=day(dk);d.journal={good:f.good.value.trim().slice(0,300),better:f.better.value.trim().slice(0,300)};touchDay(dk,100);closeSheet();rerender();toast(L('Bilan enregistré','تم حفظ الحصيلة'))}
  else if(k==='debt')saveDebt(f);
  else if(k==='debt-pay'){const d=fin('debts').items.find(x=>x.id===fm.dataset.id);const v=parseAmt(f.amt.value);if(!d||!(v>0))return;d.paid=d.paid||[];d.paid.push({amt:Math.round(v),date:now().key});persist('finance/debts',100);renderSheet();rerender();toast(isSettled(d)?L('Dette soldée. Al-hamdulillah !','تم سداد الدين. الحمد لله!'):L('Remboursement ajouté','تمت إضافة السداد'))}
  else if(k==='goal')saveGoal(f);
  else if(k==='goal-add'){const g=fin('goals').items.find(x=>x.id===fm.dataset.id);const v=parseAmt(f.amt.value);if(!g||!(v>0))return;const sign=S.form.gmove==='take'?-1:1;g.adds=g.adds||[];g.adds.push({amt:sign*Math.round(v),date:now().key});persist('finance/goals',100);renderSheet();rerender();toast(sign>0?L('Versement ajouté','تمت إضافة الإيداع'):L('Retrait noté','تم تسجيل السحب'))}
  else if(k==='rec')saveRec(f);
});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
document.addEventListener('keydown',e=>{if(S.reader&&(e.key===' '||e.key==='Enter')&&!e.target.closest('button,input,textarea,select')){e.preventDefault();readerTap();return}if(e.key!=='Escape')return;if(S.reader)closeReader();else if(S.sheet)closeSheet()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)flushAll();else rerender()});
window.addEventListener('pagehide',flushAll);

/* ================= render loop ================= */
let rq=false;
function rerender(){if(rq)return;rq=true;requestAnimationFrame(()=>{rq=false;render()})}
function render(){
  const tab=S.ui.tab;
  $$('.tab').forEach(t=>t.setAttribute('aria-current',t.dataset.tab===tab?'page':'false'));
  const fn={home:vHome,prayer:vPrayer,athkar:vAthkar,budget:vBudget,projects:vProjects}[tab]||vHome;
  $('#view').innerHTML=fn();
  S.lastKey=now().key;
  if(S.sheet&&S.sheet.live&&!sheetFocused())renderSheet();
}
function fields(form){const o={};for(const el of Array.from(form.elements)){if(el.name)o[el.name]=el}return o}
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>{t.hidden=true},2400)}
function tick(){
  const n=now();
  if(n.key!==S.lastKey){applyRecurring();render();return}
  if(S.ui.tab==='home'){const h=$('#hero');if(h)h.outerHTML=heroHTML(n);const r=$('#ram');if(r)r.outerHTML=ramadanHTML(n)||''}
  else if(S.ui.tab==='prayer'&&!S.sheet)render();
}

/* ================= boot ================= */
applyLang();applyMode();applySize();
try{const h=(location.hash||'').slice(1);if(['home','prayer','athkar','budget','projects'].includes(h))S.ui.tab=h}catch(e){}
renderChrome();
render();
setInterval(tick,30000);
initBackend();
})();
</script>
